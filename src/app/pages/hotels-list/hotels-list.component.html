<!-- hotels-list.component.html -->
<div class="luxury-hotel-booking">
  <!-- Premium Filter Bar -->
  <div class="luxury-filter-bar">
    <div class="container">
      <div class="filter-content">
        <h2 class="luxury-title">Discover Luxury Stays</h2>

        <div class="filter-controls">
          <!-- Search with Glass Effect -->
          <div class="glass-search">
            <input type="text" [(ngModel)]="filter.name"
                   (input)="loadHotels()"
                   placeholder="Search hotels...">
            <div class="search-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0 .41-.41.41-1.08 0-1.49L15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
              </svg>
            </div>
          </div>

          <!-- City Selector -->
          <div class="city-selector">
            <select [(ngModel)]="filter.city"  (change)="loadHotels()">
              <option value="0">All Destinations</option>
              <option *ngFor="let city of availableCities"  [value]="city.id">
                {{city.name}}
              </option>
            </select>
            <div class="selector-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
              </svg>
            </div>
          </div>

          <!-- Star Rating Filter -->
          <div class="star-filter">
            <div *ngFor="let star of [5,4,3,2,1]"
                 class="star-option"
                 [class.active]="filter.stars === star"
                 (click)="handleStarsChange(star)">

              <span>{{star}}</span>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
              </svg>
            </div>
            <div class="clear-stars" >
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Luxury Hotel Grid -->
  <div class="luxury-hotel-grid">
    <app-hotel-card
      *ngFor="let hotel of hotels"
      [hotel]="hotel" (deleteHotel)="onHotelDelete($event)"
      (editHotel)="onHotelEdit($event)"
      >
    </app-hotel-card>

  </div>
  <app-edit-product
    *ngIf="this.editedHotel!=undefined" [hotel]="editedHotel" [cities]="this.availableCities"

    (closeEdit)="onClose($event)"

    (updateHotelEmitter)="applyEdit($event)"

    >
  </app-edit-product>

  <!-- Pagination -->
  <div class="luxury-pagination" *ngIf="hotels.length > 0">
    <button [disabled]="filter.page === 1">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M15.41 16.09l-4.58-4.59 4.58-4.59L14 5.5l-6 6 6 6z"/>
      </svg>
    </button>

    <div class="page-numbers">
      <span *ngFor="let page of [1,2,3,4,5,6,7]"
            [class.active]="page === filter.page">
        {{page}}
      </span>
    </div>

    <button [disabled]="hotels.length < (filter.items || 10)">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M8.59 16.34l4.58-4.59-4.58-4.59L10 5.75l6 6-6 6z"/>
      </svg>
    </button>
  </div>
</div>
