<!-- hotel-card.component.html -->
<div class="hotel-card">
  <div class="hotel-image-container">
    <img
      [src]="imagesLink + encodeURIComponent(hotel.imageName ?? '')"
      class="hotel-image"
      alt="{{hotel.name}}">
    <div class="rating-badge">
      <span>{{hotel.stars || 0}}</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
      </svg>
    </div>
  </div>

  <div class="hotel-info">
    <div class="location-line">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
      <span>{{hotel.city?.name || 'Unknown'}}</span>
    </div>

    <h3 class="hotel-name">{{hotel.name}}</h3>
    <p class="hotel-address">{{hotel.address}}</p>

    <div class="star-rating">
      <div *ngFor="let star of [1,2,3,4,5]" class="star">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
        </svg>
      </div>
    </div>

    <button class="explore-btn">
      <span>Explore</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
      </svg>
    </button>

    <!-- New Edit button -->
    <button class="edit-btn" (click)="onEdit()">
      <span>Edit</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          d="M3 17.25V21h3.75l11.06-11.06-3.75-3.75L3 17.25zM20.71 7.04a1.003 1.003 0 000-1.42l-2.34-2.34a1.003 1.003 0 00-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z"
          fill="currentColor"
        />
      </svg>
    </button>


    <button class="delete-btn" (click)="onDelete()">
      <span>Delete</span>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          d="M3 6h18M9 6V4h6v2m2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h12z"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </div>
</div>
